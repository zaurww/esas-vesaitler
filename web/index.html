<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Əsas Vəsaitlər — Amortizasiya</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#fff; --ink:#15202e; --muted:#6a7a90; --line:#e3e8ef;
    --accent:#1f3a5f; --accent-soft:#eef2f7; --warn-bg:#fff6e0; --warn-ink:#8a5b00;
    --warn-line:#e8c977; --neg:#b3261e; --pos:#1a7a4c; --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  button,select,input{font:inherit;color:inherit}

  /* ---------- top bar ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--accent); color:#fff;
    display:flex; align-items:center; gap:14px; padding:10px 18px; flex-wrap:wrap;
  }
  header .brand{font-weight:600; letter-spacing:.2px; margin-right:4px}
  header .brand small{display:block;font-weight:400;font-size:11px;opacity:.7}
  header select{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    color:#fff; border-radius:6px; padding:6px 10px; cursor:pointer;
  }
  header select option{color:#15202e}
  header .spacer{flex:1}
  .btn{
    background:#fff; color:var(--accent); border:0; border-radius:6px;
    padding:7px 14px; font-weight:600; cursor:pointer; text-decoration:none;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn:hover{background:#e9eef5}
  .ver{font-size:11px; opacity:.65}

  main{padding:18px; max-width:1500px; margin:0 auto}

  /* ---------- kpi ---------- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:16px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px}
  .kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}
  .kpi .v{font-size:20px; font-weight:600; margin-top:4px; font-variant-numeric:tabular-nums}
  .kpi.hi{background:var(--accent); color:#fff; border-color:var(--accent)}
  .kpi.hi .k{color:rgba(255,255,255,.75)}

  /* ---------- tabs / toolbar ---------- */
  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .tabs{display:flex; background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .tabs button{background:none;border:0;padding:8px 16px;cursor:pointer;color:var(--muted);font-weight:500}
  .tabs button[aria-selected=true]{background:var(--accent); color:#fff}
  .filter{
    flex:1; min-width:180px; max-width:340px; background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:8px 12px;
  }
  .filter:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .hint{font-size:12px;color:var(--muted)}

  /* ---------- category sidebar ---------- */
  .layout{display:grid; grid-template-columns:212px minmax(0,1fr); gap:14px; align-items:start}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} }
  .side{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
        padding:6px; position:sticky; top:70px}
  .side button{
    display:block; width:100%; text-align:left; background:none; border:0;
    border-radius:7px; padding:8px 10px; cursor:pointer; color:var(--ink);
  }
  .side button:hover{background:var(--accent-soft)}
  .side button[aria-current=true]{background:var(--accent); color:#fff}
  .side .n{display:block; font-size:11px; opacity:.7; font-variant-numeric:tabular-nums}
  .side hr{border:0; border-top:1px solid var(--line); margin:6px 4px}

  /* ---------- tables ---------- */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px}
  /* Own scroll context so the header pins predictably and the page body
     never scrolls sideways. */
  .scroll{overflow:auto; max-height:calc(100vh - 250px)}
  table{border-collapse:collapse; width:100%; font-size:13px}
  th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left}
  td.d{white-space:nowrap}          /* dates must never wrap onto two lines */
  thead th{
    position:sticky; top:0; background:var(--accent-soft); color:var(--accent);
    font-size:11px; text-transform:uppercase; letter-spacing:.4px; z-index:5;
    box-shadow:inset 0 -1px 0 var(--line);
  }
  tbody tr.asset{cursor:pointer}
  tbody tr.asset:hover{background:#f0f4f9}
  tr.cat td{background:#f7f9fc; font-weight:600; border-top:2px solid var(--line)}
  tr.cat .rate{font-weight:400; color:var(--muted); font-size:12px; margin-left:10px}
  tr.total td{background:#eceff4; font-weight:700}
  tr.warn td{background:var(--warn-bg)}          /* trips 500/5% this year */
  tr.next td{background:#eaf2fb}                 /* will trip it next year */
  .tag{
    display:inline-block; font-size:11px; padding:1px 7px; border-radius:99px;
    background:var(--accent-soft); color:var(--accent); margin-left:6px;
  }
  .tag.w{background:var(--warn-bg); color:var(--warn-ink); border:1px solid var(--warn-line)}
  .tag.d{background:#eee; color:#555}
  .zero{color:#b6bfcb}

  /* ---------- notes ---------- */
  .note{padding:11px 14px; border-left:3px solid var(--warn-line); background:var(--warn-bg);
        color:var(--warn-ink); border-radius:0 8px 8px 0; margin-bottom:9px}
  .note.q{border-color:#8fa8c8; background:#eef3f9; color:#2c4straight}
  .note.q{color:#2c4a70}
  h3{margin:18px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted)}

  /* ---------- drawer ---------- */
  .drawer{
    position:fixed; top:0; right:0; height:100%; width:min(420px,92vw); background:var(--panel);
    border-left:1px solid var(--line); box-shadow:-12px 0 34px rgba(20,35,60,.14);
    transform:translateX(102%); z-index:40; display:flex; flex-direction:column;
    /* visibility keeps the closed drawer out of layout entirely, so it can
       never nudge the page sideways */
    visibility:hidden; transition:transform .18s ease, visibility 0s .18s;
  }
  .drawer.open{transform:none; visibility:visible; transition:transform .18s ease}
  .drawer header{background:var(--accent); position:static}
  .drawer .body{padding:16px; overflow:auto}
  .step{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line)}
  .step .l{color:var(--muted)}
  .step.res{border-bottom:0; border-top:2px solid var(--accent); font-weight:700; margin-top:4px; padding-top:9px}
  /* Indented breakdown of how a rate was derived. */
  .sub{margin:0 0 4px 14px; padding-left:12px; border-left:2px solid var(--line)}
  .sub .step{padding:5px 0; font-size:12.5px; border-bottom:0}
  .closebtn{background:rgba(255,255,255,.15); border:0; color:#fff; border-radius:6px; padding:5px 11px; cursor:pointer}
  .err{background:#fdecea; border:1px solid #f3b7b1; color:#8b1a12; padding:14px; border-radius:var(--radius)}
  .acts{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .acts button{background:var(--accent-soft); color:var(--accent); border:1px solid var(--line);
                border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12.5px}
  .acts button:hover{background:#dde6f1}
  .acts button.danger{color:var(--neg)}
  .tagbtn{background:none; border:1px solid var(--line); border-radius:99px;
          font-size:11px; padding:1px 9px; margin-left:8px; cursor:pointer; color:var(--accent)}
  .tagbtn:hover{background:var(--accent-soft)}

  /* ---------- modal form ---------- */
  .modal{position:fixed; inset:0; background:rgba(16,26,42,.45); z-index:60;
         display:none; align-items:flex-start; justify-content:center; padding:6vh 16px}
  .modal.open{display:flex}
  .modal .box{background:var(--panel); border-radius:12px; width:min(560px,100%);
              max-height:88vh; overflow:auto; box-shadow:0 24px 60px rgba(10,20,40,.3)}
  .modal h2{margin:0; padding:16px 20px; font-size:15px; background:var(--accent); color:#fff;
            border-radius:12px 12px 0 0; display:flex; justify-content:space-between}
  .modal form{padding:18px 20px 20px}
  .fld{margin-bottom:13px}
  .fld label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px}
  .fld input,.fld select,.fld textarea{
    width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:7px;
    background:#fdfdfe;
  }
  .fld input:focus,.fld select:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .fld .h{font-size:11.5px; color:var(--muted); margin-top:4px}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .modes{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap}
  .modes button{flex:1; min-width:120px; background:var(--accent-soft); border:1px solid var(--line);
                border-radius:8px; padding:9px 8px; cursor:pointer; font-size:12.5px; text-align:left}
  .modes button[aria-pressed=true]{background:var(--accent); color:#fff; border-color:var(--accent)}
  .modes small{display:block; opacity:.75; font-size:11px; font-weight:400}
  .modal .foot{display:flex; gap:9px; justify-content:flex-end; margin-top:6px}
  .primary{background:var(--accent); color:#fff; border:0; border-radius:7px;
           padding:9px 20px; cursor:pointer; font-weight:600}
  .ghost{background:none; border:1px solid var(--line); border-radius:7px;
         padding:9px 16px; cursor:pointer}
  .modal .box.wide{width:min(1100px,100%)}
  .imp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px}
  .imp-grid .fld{margin:0}
  .imp table{font-size:12px}
  .imp .bad td{background:#fdecea}
  .imp .good td{background:#f2f9f4}
  .paste{width:100%; min-height:150px; font-family:Consolas,monospace; font-size:12px;
         border:1px solid var(--line); border-radius:8px; padding:10px}
  .stepbar{display:flex; gap:8px; margin-bottom:14px; font-size:12px; color:var(--muted)}
  .stepbar span{padding:4px 10px; border-radius:99px; background:var(--accent-soft)}
  .stepbar span.on{background:var(--accent); color:#fff}
  .ferr{background:#fdecea; border:1px solid #f3b7b1; color:#8b1a12;
        padding:10px 12px; border-radius:8px; margin-bottom:12px; display:none}
</style>
</head>
<body>

<header>
  <div class="brand">Əsas Vəsaitlər<small id="sub">yüklənir…</small></div>
  <select id="client"></select>
  <select id="year"></select>
  <div class="spacer"></div>
  <span class="ver" id="ver"></span>
  <button class="btn" onclick="formAsset()">+ Yeni ƏV</button>
  <button class="btn" onclick="formImport()">⇪ İdxal</button>
  <a class="btn" id="export" href="#">⬇ Excel-ə ixrac</a>
</header>

<div class="modal" id="modal" onclick="if(event.target===this) closeModal()">
  <div class="box">
    <h2><span id="mtitle">—</span>
      <button class="closebtn" onclick="closeModal()">✕</button></h2>
    <form id="mform" onsubmit="return submitModal(event)">
      <div class="ferr" id="ferr"></div>
      <div id="mbody"></div>
      <div class="foot">
        <button type="button" class="ghost" onclick="closeModal()">İmtina</button>
        <button type="submit" class="primary" id="msubmit">Yadda saxla</button>
      </div>
    </form>
  </div>
</div>

<main>
  <div id="error" style="display:none" class="err"></div>
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="annual" aria-selected="true">İllik hesabat</button>
      <button role="tab" data-tab="monthly" aria-selected="false">Aylıq</button>
      <button role="tab" data-tab="repair" aria-selected="false">Təmir (m.115)</button>
      <button role="tab" data-tab="norms" aria-selected="false">Normalar</button>
      <button role="tab" data-tab="notes" aria-selected="false">Qeydlər <span id="notecount"></span></button>
    </div>
    <input class="filter" id="filter" placeholder="Axtar:  ad, inv.№…   ( / )">
    <span class="hint" id="hint"></span>
  </div>

  <div class="layout">
    <nav class="side" id="side"></nav>
    <div id="view"></div>
  </div>
</main>

<aside class="drawer" id="drawer">
  <header><strong id="dtitle">—</strong><div class="spacer"></div>
    <button class="closebtn" onclick="closeDrawer()">Bağla</button></header>
  <div class="body" id="dbody"></div>
</aside>

<script>
const fmt = new Intl.NumberFormat('az-AZ',{minimumFractionDigits:2,maximumFractionDigits:2});
const money = s => { const n = parseFloat(s); return n === 0
  ? '<span class="zero">—</span>' : fmt.format(n); };
const pct = s => (parseFloat(s)*100).toFixed(0) + '%';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let CTX = null, REPORT = null, TAB = 'annual', FILTER = '', CATFILTER = '';

function needStatus(year){
  const box = document.getElementById('error');
  box.style.display = 'block';
  box.style.background = '#eef3f9';
  box.style.borderColor = '#8fa8c8';
  box.style.color = '#2c4a70';
  box.innerHTML = `<strong>${year} ili hələ qurulmayıb</strong><br>
    Sahibkarlıq statusu olmadan normaya tətbiq olunan əmsal məlum deyil, ona
    görə hesablama başlamır.
    <div class="acts" style="margin:10px 0 0">
      <button onclick="formStatus(${year})">${year} üçün statusu təyin et</button>
    </div>`;
  document.getElementById('view').innerHTML = '';
  document.getElementById('side').innerHTML = '';
  document.getElementById('kpis').innerHTML = '';
}

function fail(msg){
  const box = document.getElementById('error');
  // needStatus() tints the same box blue; reset it back to the error look.
  box.style.background = ''; box.style.borderColor = ''; box.style.color = '';
  box.style.display = 'block';
  box.innerHTML = `<strong>Hesablama dayandırıldı</strong><br>${esc(msg)}`;
  document.getElementById('view').innerHTML = '';
  document.getElementById('side').innerHTML = '';
  document.getElementById('kpis').innerHTML = '';
}

async function boot(){
  // §2.1 — never leave a blank screen: any failure here must be visible.
  try {
    const r = await fetch('/api/context');
    CTX = await r.json();
    if (!r.ok || !CTX.clients) return fail(CTX.error || 'context alınmadı');
  } catch (e) { return fail(e.message); }
  const cs = document.getElementById('client');
  cs.innerHTML = CTX.clients.map(c =>
    `<option value="${c.slug}">${esc(c.name)} · ${esc(c.slug)}</option>`).join('');
  document.getElementById('ver').textContent = 'engine ' + CTX.engine_version;
  cs.onchange = () => { fillYears(); load(); };
  document.getElementById('year').onchange = load;
  fillYears(); load();
}

function fillYears(){
  const c = CTX.clients.find(x => x.slug === document.getElementById('client').value);
  const ys = document.getElementById('year');
  ys.innerHTML = (c.years || []).map(y =>
    `<option value="${y}">${y}${c.closed_years.includes(y) ? ' · bağlı' : ''}</option>`).join('');
  // Open on a year that computes, not merely the newest one present.
  if (c.years && c.years.length) ys.value = c.default_year || c.years[c.years.length-1];
}

async function load(){
  const slug = document.getElementById('client').value;
  const year = document.getElementById('year').value;
  const cinfo = CTX.clients.find(x => x.slug === slug);
  if (cinfo && cinfo.error) return fail(cinfo.error);
  document.getElementById('export').href = `/api/export?client=${slug}&year=${year}`;
  const r = await fetch(`/api/report?client=${slug}&year=${year}`);
  const data = await r.json();
  // §2.1 — a failed calculation is shown, never replaced by zeros.
  // A missing setup step is not an error to stare at: offer the fix.
  if (!r.ok && data.need === 'status') return needStatus(data.year);
  if (!r.ok) return fail(data.error);
  document.getElementById('error').style.display = 'none';
  REPORT = data;
  document.getElementById('sub').textContent =
    `VÖEN ${data.voen} · ${data.status_name}${data.is_closed ? ' · İL BAĞLIDIR' : ''}`;
  const n = data.warnings.length + data.open_questions.length;
  document.getElementById('notecount').textContent = n ? `(${n})` : '';
  render();
}

function render(){
  const d = REPORT, t = d.totals;
  document.getElementById('kpis').innerHTML = [
    ['Qalıq — il əvvəli', t.opening, ''],
    ['Daxilolma', t.acquisition, ''],
    ['Xaricetmə', t.disposed, ''],
    ['Amortizasiya', t.depreciation, 'hi'],
    ['Silinmə 500/5%', t.writeoff, ''],
    ['Qalıq — il sonu', t.closing, ''],
  ].map(([k,v,c]) => `<div class="kpi ${c}"><div class="k">${k}</div>
      <div class="v">${fmt.format(parseFloat(v))}</div></div>`).join('');

  document.getElementById('hint').textContent =
    TAB === 'monthly' ? 'İllik məbləğ / 12 · yuvarlaqlaşdırma qalığı dekabrda'
    : TAB === 'annual' ? 'Sətrə klikləyin — hesablamanın gedişi' : '';

  renderSide(d);
  document.getElementById('view').innerHTML =
    TAB === 'annual' ? viewAnnual(d) : TAB === 'monthly' ? viewMonthly(d)
    : TAB === 'repair' ? viewRepair(d)
    : TAB === 'norms' ? '<div class="card" style="padding:16px">yüklənir…</div>'
    : viewNotes(d);
  if (TAB === 'norms') loadNorms();
}

/* Statutory norms: ONE file per installation, not per client (§5.1).
   The law is the same for everyone; a per-client copy would give five
   clients five readings of it. */
async function loadNorms(){
  const d = await (await fetch(`/api/rates?year=${REPORT.year}`)).json();
  const src = s => s === 'user'
    ? '<span class="tag w">əl ilə yazılıb</span>'
    : '<span class="tag d">proqramdan</span>';
  // A null rate means the category derives it from the useful life (FİM),
  // not that the value is missing.
  const pc = v => v == null ? '<span class="zero">FİM-dən</span>'
                            : (parseFloat(v)*100).toFixed(v*100 % 1 ? 2 : 0) + '%';
  let rows = d.rates.map(r => `<tr>
      <td>${esc(r.code)}</td><td>${esc(r.name_az)}</td>
      <td class="num">${pc(r.max_rate)}</td>
      <td class="num">${pc(r.repair_limit)}</td>
      <td class="num">${r.effective_year}</td>
      <td>${src(r.source)}</td>
      <td><button class="tagbtn" onclick='formNorm(${JSON.stringify(r)})'>dəyiş</button></td>
    </tr>`).join('');
  let coef = d.coefficients.map(c => `<tr>
      <td>${esc(c.status)}</td><td>${esc(c.name)}</td>
      <td class="num">× ${c.coefficient}</td>
      <td class="num">${c.effective_year}</td>
      <td>${src(c.source)}</td>
      <td><button class="tagbtn" onclick='formCoef(${JSON.stringify(c)})'>dəyiş</button></td>
    </tr>`).join('');
  document.getElementById('view').innerHTML = `
    <div class="card"><div class="scroll"><table><thead><tr>
      <th>Kod</th><th>Kateqoriya</th><th class="num">Norma (maks)</th>
      <th class="num">Təmir limiti (m.115)</th><th class="num">Qüvvədə</th>
      <th>Mənbə</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <h3>Sahibkarlıq əmsalları</h3>
    <div class="card"><div class="scroll"><table><thead><tr>
      <th>Kod</th><th>Status</th><th class="num">Əmsal</th>
      <th class="num">Qüvvədə</th><th>Mənbə</th><th></th></tr></thead>
      <tbody>${coef}</tbody></table></div></div>
    <div class="note q">Bu cədvəl <strong>bütün müştərilər üçün ümumidir</strong> —
      qanun hamı üçün eynidir. Dəyişiklik <code>rates.tsv</code> /
      <code>coefficients.tsv</code> fayllarına yazılır.<br>
      <strong>Qanun dəyişibsə</strong> — yeni qüvvəyəminmə ili ilə sətir əlavə edin,
      keçmiş illər toxunulmaz qalır. <strong>Səhv yazılıbsa</strong> — həmin ili
      düzəldin: onda bütün keçmiş hesablamalar da düzəlir.</div>`;
}

function formNorm(r){
  openModal(`Norma — ${r.name_az}`,
    `<input type="hidden" name="category" value="${r.code}">` +
    `<div class="row2">
      ${fld('max_rate','Amortizasiya norması (maks)',{value:r.max_rate==null?'':(r.max_rate*100).toFixed(0),
            hint:'Faizlə. Boş = mövcud dəyər.'})}
      ${fld('repair_limit','Təmir limiti (m.115)',{value:r.repair_limit==null?'':(r.repair_limit*100).toFixed(0),
            hint:'Faizlə.'})}</div>` +
    fld('effective_year','Qüvvəyə minmə ili',{type:'number',value:r.effective_year,req:true,
        hint:'Qanun dəyişibsə — yeni il yazın (keçmiş illər dəyişmir). '
           + 'Səhvi düzəldirsinizsə — mövcud ili ('+r.effective_year+') saxlayın.'}) +
    fld('note','Qeyd',{placeholder:'VM m.115.1'}),
    d => post('rate.set', d));
}

function formCoef(c){
  openModal(`Əmsal — ${c.name}`,
    `<input type="hidden" name="status" value="${c.status}">` +
    `<div class="row2">
      ${fld('coefficient','Əmsal',{value:c.coefficient,req:true,hint:'Məs. 2 və ya 1.5'})}
      ${fld('effective_year','Qüvvəyə minmə ili',{type:'number',value:c.effective_year,req:true})}
     </div>` + fld('note','Qeyd'),
    d => post('coefficient.set', d));
}

function renderSide(d){
  const btn = (code, label, sub, on) =>
    `<button aria-current="${on}" onclick="pickCat('${code}')">${esc(label)}
       <span class="n">${sub}</span></button>`;
  let h = btn('', 'Bütün kateqoriyalar',
              `${cardCount(d)} ƏV · ${fmt.format(parseFloat(d.totals.depreciation))}`,
              CATFILTER === '') + '<hr>';
  for (const cat of d.categories){
    h += btn(cat.code, cat.name_az,
             `${cat.cards.length} ƏV · ${fmt.format(parseFloat(cat.depreciation))}`,
             CATFILTER === cat.code);
  }
  document.getElementById('side').innerHTML = h;
}

function pickCat(code){ CATFILTER = (CATFILTER === code) ? '' : code; render(); }

// Article 115: the deductible limit is a percentage of the GROUP's opening
// residual, while the spend itself is recorded per asset. Anything over the
// limit is capitalised into that asset's depreciation base (step 3).
function viewRepair(d){
  const rc = cats(d).filter(c => parseFloat(c.repair_actual) !== 0);
  if (!rc.length) return `<div class="card" style="padding:16px">
    ${d.year}-ci il üçün təmir xərci qeyd olunmayıb.
    <div class="hint" style="margin-top:6px">repairs.tsv boşdur.</div></div>`;
  let rows = '';
  for (const cat of rc){
    // Spell the limit out: it is a group figure applied to per-asset spend,
    // which is the part accountants ask about.
    const lim = parseFloat(cat.repair_limit), act = parseFloat(cat.repair_actual);
    rows += `<tr class="cat"><td colspan="6">${esc(cat.name_az)}
      <span class="rate">qrupun il əvvəlinə qalığı ${money(cat.opening)}
      × ${pct(cat.repair_limit_pct)} = limit <strong>${money(cat.repair_limit)}</strong>
      · faktiki ${money(cat.repair_actual)}
      → gəlirdən çıxılan MIN = <strong>${money(cat.repair_deductible)}</strong>
      ${act > lim ? `· artıq qalan ${money(cat.repair_capitalized)} kapitallaşır`
                  : '· limit aşılmayıb, hamısı çıxılır'}</span></td></tr>`;
    for (const c of cat.cards){
      if (parseFloat(c.repair_actual) === 0) continue;
      const share = parseFloat(c.repair_actual) / parseFloat(cat.repair_actual);
      rows += `<tr><td>${esc(c.inv_no)}</td><td>${esc(c.name)}
        <span class="rate">pay ${money(c.repair_actual)} / ${money(cat.repair_actual)}
        = ${(share*100).toFixed(2)}% → ${money(cat.repair_deductible)} × ${(share*100).toFixed(2)}%
        = ${money(c.repair_deductible)}</span></td>
        <td class="num">${money(c.repair_actual)}</td>
        <td class="num">${money(c.repair_deductible)}</td>
        <td class="num">${money(c.repair_capitalized)}</td>
        <td class="num">${money(c.base)}</td></tr>`;
    }
    rows += `<tr class="total"><td colspan="2">${esc(cat.name_az)} — qrup limiti
      ${money(cat.repair_limit)} (qalıq ${money(cat.opening)})</td>
      <td class="num">${money(cat.repair_actual)}</td>
      <td class="num">${money(cat.repair_deductible)}</td>
      <td class="num">${money(cat.repair_capitalized)}</td><td></td></tr>`;
  }
  const t = d.totals;
  return `<div class="card"><div class="scroll"><table><thead><tr>
      <th>İnv.№</th><th>Adı</th><th class="num">Faktiki təmir</th>
      <th class="num">Gəlirdən çıxılan</th><th class="num">Kapitallaşan</th>
      <th class="num">Amortizasiya bazası</th></tr></thead>
    <tbody>${rows}<tr class="total"><td colspan="2">C Ə M İ</td>
      <td class="num">${money(t.repair_actual)}</td>
      <td class="num">${money(t.repair_deductible)}</td>
      <td class="num">${money(t.repair_capitalized)}</td><td></td></tr>
    </tbody></table></div></div>
    <div class="note q">Limit = qrupun il əvvəlinə qalıq dəyəri × kateqoriya faizi.
      Faktiki xərc limitdən çox olduqda, çıxılan hissə qrup daxilində təmir
      məbləğlərinə mütənasib bölünür, qalığı isə həmin ƏV-in amortizasiya
      bazasına əlavə olunur (CLAUDE.md §5.5).</div>`;
}

const match = c => !FILTER ||
  (c.name + ' ' + c.inv_no + ' ' + c.category).toLowerCase().includes(FILTER);
// The sidebar narrows the whole report to one category; the text box narrows
// it further to matching cards. Both are view state, never engine state.
const cats = d => d.categories.filter(c => !CATFILTER || c.code === CATFILTER);
const cardCount = d => d.categories.reduce((n, c) => n + c.cards.length, 0);

function viewAnnual(d){
  const head = ['','İnv.№','Adı','Alış tarixi','İlkin dəyər','Qalıq (il əvvəli)',
                'Daxilolma','Dəyər artımı','Kapital. təmir','Xaricetmə','Dərəcə',
                'Amortizasiya','Silinmə','Qalıq (il sonu)'];
  let rows = '';
  for (const cat of cats(d)){
    const cards = cat.cards.filter(match);
    if (!cards.length) continue;
    const r = cat.rate;
    rows += `<tr class="cat"><td colspan="14">${esc(cat.name_az)}
      <span class="rate">${pct(r.statutory_max)} × ${r.coefficient} (${esc(d.status)})
      = ${pct(r.ceiling)} hədd · tətbiq <strong>${pct(r.applied)}</strong>
      ${cat.mixed_rates ? '<span class="tag">fərdi dərəcələr var</span>'
        : r.below_ceiling ? '<span class="tag w">həddən aşağı</span>' : ''}
      ${d.is_closed ? '' : `<button class="tagbtn"
        onclick="event.stopPropagation();formElection(REPORT.categories.find(x=>x.code==='${cat.code}'))"
        >dərəcəni dəyiş</button>`}</span></td></tr>`;
    for (const c of cards){
      const cls = c.threshold_hit ? 'asset warn'
                : c.threshold_next ? 'asset next' : 'asset';
      rows += `<tr class="${cls}" onclick="openCard('${c.asset_id}')"
        title="${c.threshold_next ? esc(c.threshold_next_reason) : ''}">
        <td>${c.threshold_hit ? '⚠' : c.threshold_next ? '◐'
             : (c.disposal_type ? '→' : '')}</td>
        <td>${esc(c.inv_no)}</td>
        <td>${esc(c.name)}${c.is_legacy_pool ? '<span class="tag">qrup qalığı</span>' : ''}
            ${c.written_off ? '<span class="tag w">silindi</span>' : ''}
            ${c.disposal_type ? `<span class="tag d">${esc(c.disposal_type)}</span>` : ''}</td>
        <td class="d">${esc(c.in_date)}</td>
        <td class="num">${money(c.cost)}</td>
        <td class="num">${money(c.opening)}</td>
        <td class="num">${money(c.acquisition)}</td>
        <td class="num">${money(c.addition)}</td>
        <td class="num">${money(c.repair_capitalized)}</td>
        <td class="num">${money(c.disposed)}</td>
        <td class="num">${parseFloat(c.rate) ? pct(c.rate) : '<span class="zero">—</span>'}${
          c.rate_info && c.rate_info.source === 'asset'
            ? '<span class="tag" title="bu ƏV üçün fərdi dərəcə">f</span>' : ''}</td>
        <td class="num"><strong>${money(c.depreciation)}</strong></td>
        <td class="num">${money(c.writeoff)}</td>
        <td class="num">${money(c.closing)}</td></tr>`;
    }
    rows += `<tr class="total"><td colspan="4">${esc(cat.name_az)} — yekun</td>
      <td class="num"></td><td class="num">${money(cat.opening)}</td>
      <td class="num">${money(cat.acquisition)}</td>
      <td class="num">${money(cat.addition)}</td>
      <td class="num">${money(cat.repair_capitalized)}</td>
      <td class="num">${money(cat.disposed)}</td>
      <td></td><td class="num">${money(cat.depreciation)}</td>
      <td class="num">${money(cat.writeoff)}</td><td class="num">${money(cat.closing)}</td></tr>`;
  }
  // With a category picked, the grand total must cover only what is shown.
  const shown = cats(d);
  const t = CATFILTER
    ? Object.fromEntries(['opening','acquisition','addition','repair_capitalized',
        'disposed','depreciation','writeoff','closing'].map(k =>
        [k, shown.reduce((s,c) => s + parseFloat(c[k]), 0).toFixed(2)]))
    : d.totals;
  rows += `<tr class="total"><td colspan="4">C Ə M İ${
    CATFILTER ? ' (seçilmiş kateqoriya)' : ''}</td><td></td>
    <td class="num">${money(t.opening)}</td><td class="num">${money(t.acquisition)}</td>
    <td class="num">${money(t.addition)}</td>
    <td class="num">${money(t.repair_capitalized)}</td>
    <td class="num">${money(t.disposed)}</td><td></td>
    <td class="num">${money(t.depreciation)}</td><td class="num">${money(t.writeoff)}</td>
    <td class="num">${money(t.closing)}</td></tr>`;
  return `<div class="card"><div class="scroll"><table><thead><tr>${
    head.map((h,i) => `<th class="${i>3?'num':''}">${h}</th>`).join('')
  }</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function viewMonthly(d){
  let rows = '';
  for (const cat of cats(d)){
    const cards = cat.cards.filter(c => match(c) && parseFloat(c.depreciation) !== 0);
    if (!cards.length) continue;
    rows += `<tr class="cat"><td colspan="15">${esc(cat.name_az)}</td></tr>`;
    for (const c of cards){
      rows += `<tr><td>${esc(c.inv_no)}</td><td>${esc(c.name)}</td>` +
        c.monthly.map(v => `<td class="num">${money(v)}</td>`).join('') +
        `<td class="num"><strong>${money(c.depreciation)}</strong></td></tr>`;
    }
    rows += `<tr class="total"><td colspan="2">${esc(cat.name_az)} — yekun</td>` +
      cat.monthly.map(v => `<td class="num">${money(v)}</td>`).join('') +
      `<td class="num">${money(cat.depreciation)}</td></tr>`;
  }
  rows += `<tr class="total"><td colspan="2">C Ə M İ</td>` +
    d.monthly.map(v => `<td class="num">${money(v)}</td>`).join('') +
    `<td class="num">${money(d.totals.depreciation)}</td></tr>`;
  return `<div class="card"><div class="scroll"><table><thead><tr>
    <th>İnv.№</th><th>Adı</th>${d.months.map(m => `<th class="num">${m}</th>`).join('')}
    <th class="num">C Ə M İ</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

function viewNotes(d){
  let h = '';
  if (d.warnings.length){
    h += '<h3>Xəbərdarlıqlar</h3>' +
      d.warnings.map(w => `<div class="note">${esc(w)}</div>`).join('');
  }
  if (d.open_questions.length){
    h += '<h3>Həll olunmamış suallar (CLAUDE.md §12)</h3>' +
      d.open_questions.map(w => `<div class="note q">${esc(w)}</div>`).join('');
  }
  const n = k => fmt.format(parseFloat(d.totals[k]));
  h += `<h3>Yoxlama</h3><div class="card" style="padding:14px">
    Balans eyniliyi: qalıq(əvvəl) + daxilolma + dəyər artımı + kapitallaşan təmir
    − xaricetmə − amortizasiya − silinmə = qalıq(son)
    <br><strong>${n('opening')} + ${n('acquisition')} + ${n('addition')}
    + ${n('repair_capitalized')} − ${n('disposed')} − ${n('depreciation')}
    − ${n('writeoff')} = ${n('closing')}</strong> ✔
    <div class="hint" style="margin-top:8px">Hər kateqoriya üzrə də yoxlanılır;
      uyğunsuzluq halında hesablama dayanır (§2.1).</div></div>
    <h3>Versiya</h3><div class="card" style="padding:14px">
      engine ${esc(d.engine_version)} · format v${d.format_version}</div>`;
  return h || '<div class="card" style="padding:16px">Qeyd yoxdur.</div>';
}

let CARD = null, CAT = null;
function openCard(id){
  let card = null, cat = null;
  for (const k of REPORT.categories) for (const x of k.cards)
    if (x.asset_id === id){ card = x; cat = k; }
  if (!card) return;
  CARD = card; CAT = cat;
  document.getElementById('dtitle').textContent = (card.inv_no ? card.inv_no + ' · ' : '') + card.name;
  const step = (l, v, extra='') =>
    `<div class="step ${extra}"><span class="l">${l}</span><span class="num">${
      typeof v === 'string' && !isNaN(parseFloat(v)) ? fmt.format(parseFloat(v)) : v}</span></div>`;
  let h = '';
  if (!REPORT.is_closed){
    h += `<div class="acts">
      <button onclick="showHistory('${card.asset_id}')"><strong>Tam tarixçə</strong></button>
      <button onclick="formAsset(CARD)">Redaktə</button>
      <button onclick="formOpening(CARD)">Açılış qalığı</button>
      <button onclick="formDisposal(CARD)">Xaricetmə</button>
      <button onclick="formRepair(CARD)">Təmir xərci</button>
      <button onclick="formAddition(CARD)">Dəyər artımı</button>
      <button onclick="formElection(CAT, CARD)">Fərdi dərəcə</button>
      ${card.threshold_hit ? `<button onclick="toggleWriteoff(CARD, ${!card.written_off})">
        ${card.written_off ? 'Silinməni ləğv et' : '500/5% silinməsi'}</button>` : ''}
      <button class="danger" onclick="confirmDelete(CARD)">Sil</button>
    </div>`;
  } else {
    h += `<div class="acts">
      <button onclick="showHistory('${card.asset_id}')"><strong>Tam tarixçə</strong></button>
    </div>
    <div class="note">${REPORT.year} ili bağlıdır — dəyişiklik qəbul edilmir (§6).</div>`;
  }
  h += step('İlkin dəyər (alış)', card.cost);
  if (parseFloat(card.cost_effective) !== parseFloat(card.cost))
    h += step('İlkin dəyər (artımlarla)', card.cost_effective);
  h += step('1 · Qalıq (il əvvəli)', card.opening);
  h += step('2 · Daxilolma', card.acquisition);
  h += step('2a · Dəyər artımı (komponent)', card.addition);
  h += step('3 · Kapitallaşan təmir (m.115)', card.repair_capitalized);
  h += step('4 · Xaricetmə', card.disposed);
  h += step('= Amortizasiya bazası', card.base);
  h += `<div class="step"><span class="l">5 · 500/5% həddi</span><span>${
    card.threshold_hit ? '⚠ düşür' : 'düşmür'}</span></div>`;
  if (card.threshold_hit)
    h += `<div class="note" style="margin:8px 0">${esc(card.threshold_reason)}<br>
      ${card.written_off ? 'writeoffs.tsv-də qərar var → tam silinmə'
                         : 'qərar yoxdur → silinmə tətbiq edilmədi'}</div>`;

  // Step 6 is the audit trail for the single most questionable number in the
  // whole return: a rate above the one printed in the tax code. Spelled out
  // factor by factor so it answers "why 50% when article 114.3 says 25%".
  const r6 = card.rate_info || cat.rate;
  const SRC = {asset: 'bu ƏV üçün fərdi seçim', category: 'kateqoriya üzrə seçim',
               norm: 'seçim yoxdur — m.114.3 norması'};
  h += `<div class="step"><span class="l"><strong>6 · Amortizasiya dərəcəsi</strong></span>
        <span><strong>${pct(r6.applied)}</strong></span></div>
    <div class="sub">
      <div class="step"><span class="l">VM m.114.3 norması (maksimum)</span>
        <span class="num">${pct(r6.statutory_max)}</span></div>
      <div class="step"><span class="l">Sahibkar əmsalı — ${esc(REPORT.status_name)}
        <em style="opacity:.75">${parseFloat(r6.coefficient) > 1
          ? (r6.coefficient_used ? '(istifadə olunur)' : '(haqdır, istifadə olunmayıb)')
          : ''}</em></span>
        <span class="num">× ${r6.coefficient}</span></div>
      <div class="step"><span class="l">Yuxarı hədd</span>
        <span class="num">= ${pct(r6.ceiling)}</span></div>
      <div class="step"><span class="l">Tətbiq olunan — ${SRC[r6.source]}</span>
        <span class="num">${pct(r6.applied)}</span></div>
    </div>
    ${r6.below_ceiling ? `<div class="note" style="margin:8px 0">Hədddən aşağı dərəcə
      seçilib — qanunidir, lakin şüurlu qərar olmalıdır.</div>` : ''}`;
  h += step('Amortizasiya', card.depreciation);
  if (parseFloat(card.writeoff)) h += step('Silinmə', card.writeoff);
  h += step('7 · Qalıq (il sonu)', card.closing, 'res');
  if (card.disposal_type){
    h += `<h3>Xaricetmə</h3>` + step('Tarix', card.disposal_date) +
         step('Növ', card.disposal_type) + step('Satış', card.proceeds) +
         step('Qalıq', card.disposed) + step('Fərq', card.gain_loss) +
         `<div class="note q" style="margin-top:8px">Satışdan gəlir/zərərin bəyannamədə
          əks etdirilməsi həll olunmayıb — CLAUDE.md §12.1</div>`;
  }
  if (parseFloat(card.depreciation)){
    h += '<h3>Aylıq bölgü</h3><div class="scroll"><table>' +
      card.monthly.map((v,i) =>
        `<tr><td>${REPORT.months[i]}</td><td class="num">${money(v)}</td></tr>`).join('') +
      '</table></div>';
  }
  document.getElementById('dbody').innerHTML = h;
  document.getElementById('drawer').classList.add('open');
}
const closeDrawer = () => document.getElementById('drawer').classList.remove('open');

/* ==================== data entry ==================== */

let MSUBMIT = null;

async function post(action, payload){
  const r = await fetch('/api/action', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({client: document.getElementById('client').value, action, payload})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'xəta');
  return j;
}

function openModal(title, body, onSubmit, submitLabel){
  document.getElementById('mtitle').textContent = title;
  document.getElementById('mbody').innerHTML = body;
  document.getElementById('ferr').style.display = 'none';
  document.getElementById('msubmit').textContent = submitLabel || 'Yadda saxla';
  MSUBMIT = onSubmit;
  document.getElementById('modal').classList.add('open');
  const first = document.querySelector('#mbody input,#mbody select');
  if (first) first.focus();
}
const closeModal = () => {
  document.getElementById('modal').classList.remove('open'); MSUBMIT = null;
};

async function submitModal(e){
  e.preventDefault();
  const box = document.getElementById('ferr');
  const btn = document.getElementById('msubmit');
  const data = Object.fromEntries(new FormData(document.getElementById('mform')));
  btn.disabled = true;
  try {
    await MSUBMIT(data);
    closeModal();
    CTX = await (await fetch('/api/context')).json();
    await load();
  } catch (err) {
    // A wizard step transition is not a failure -- keep the modal open.
    if (err.message === '__stay__'){ btn.disabled = false; return false; }
    // The store rolls itself back on failure, so the message is the whole story.
    box.textContent = err.message; box.style.display = 'block';
  } finally { btn.disabled = false; }
  return false;
}

const val = v => esc(v == null ? '' : v);
const fld = (name, label, o = {}) => `<div class="fld">
  <label>${label}</label>
  ${o.type === 'select'
    ? `<select name="${name}" ${o.req ? 'required' : ''}>${o.options}</select>`
    : `<input name="${name}" type="${o.type || 'text'}" value="${val(o.value)}"
        ${o.req ? 'required' : ''} ${o.step ? `step="${o.step}"` : ''}
        ${o.placeholder ? `placeholder="${o.placeholder}"` : ''}>`}
  ${o.hint ? `<div class="h">${o.hint}</div>` : ''}</div>`;

const catOptions = sel => CTX.categories.filter(c => !c.code.startsWith('qma'))
  .map(c => `<option value="${c.code}" ${c.code === sel ? 'selected' : ''}>
    ${esc(c.name_az)}</option>`).join('');

/* ---- asset: new / carried over / group pool ---- */
function formAsset(card){
  const edit = !!card;
  let mode = 'new';
  const year = REPORT.year;

  const render = () => {
    const modes = edit ? '' : `<div class="modes">
      ${[['new','Bu il alınıb','tarix və ilkin dəyər məlumdur'],
         ['carried','Əvvəlki illərdən','qalıq dəyər son bəyannamədən'],
         ['pool','Qrup qalığı (kartsız)','yalnız kateqoriya üzrə cəm məlumdur']]
        .map(([m,t,s]) => `<button type="button" aria-pressed="${mode===m}"
          onclick="ASSETMODE('${m}')">${t}<small>${s}</small></button>`).join('')}
    </div>`;
    const pool = mode === 'pool';
    let h = modes + `<input type="hidden" name="mode" value="${mode}">`;
    if (edit) h += `<input type="hidden" name="asset_id" value="${card.asset_id}">`;
    h += fld('category','Kateqoriya',{type:'select',req:true,
             options:catOptions(card ? card.category : 'nv')});
    if (!pool){
      h += `<div class="row2">
        ${fld('inv_no','İnv.№',{value:card&&card.inv_no,placeholder:'NV-0006'})}
        ${fld('in_date','Alış tarixi',{type:'date',value:card&&card.in_date,
              req:mode==='new'})}</div>`;
      h += fld('name','Adı',{value:card&&card.name,req:true,placeholder:'Toyota Camry 2.5'});
      h += fld('cost','İlkin dəyər (AZN)',{type:'number',step:'0.01',
              value:card&&card.cost,req:mode==='new',
              hint: mode==='carried'
                ? 'Məlum deyilsə boş buraxın — onda 500/5% testinin yalnız 500 AZN hissəsi işləyəcək.'
                : ''});
      h += fld('counterparty','Kontragent',{value:card&&card.counterparty});
    } else {
      h += fld('name','Adı',{placeholder:'avtomatik: «kateqoriya — qrup qalığı»',
              hint:'Kartsız qrup qalığı: inventar nömrəsi, tarix və ilkin dəyər olmur. '
                 + '5% testi tətbiq edilmir, yalnız 500 AZN.'});
    }
    if (!edit && mode !== 'new'){
      h += `<div class="row2">
        ${fld('opening_residual',`Qalıq dəyər — ${year} ilin əvvəlinə (AZN)`,
              {type:'number',step:'0.01',req:true})}
        ${fld('opening_year','İl',{type:'number',value:year,req:true})}</div>`;
    }
    h += fld('note','Qeyd',{value:card&&card.note});
    openModal(edit ? `ƏV redaktəsi — ${card.inv_no || card.name}` : 'Yeni ƏV', h,
      d => post(edit ? 'asset.update' : 'asset.create', d),
      edit ? 'Yadda saxla' : 'Əlavə et');
  };
  window.ASSETMODE = m => { mode = m; render(); };
  render();
}

     <input type="hidden" name="year" value="${REPORT.year}">` +

    `<div class="row2">

   A component bought for an asset already on the books. Not a repair: it is
   not limited by article 115, it joins the cost in full. */
function formAddition(card){
  openModal(`Dəyər artımı — ${card.inv_no || card.name}`,
    `<input type="hidden" name="asset_id" value="${card.asset_id}">` +
    `<div class="row2">
      ${fld('date','Tarix',{type:'date',req:true,value:REPORT.year+'-01-01'})}
      ${fld('amount','Məbləğ (AZN)',{type:'number',step:'0.01',req:true})}</div>` +
    fld('note','Nə alınıb',{placeholder:'Əlavə yaddaş, komponent…'}) +
    `<div class="note q" style="margin-top:6px">Təmirdən fərqi: təmir aktivi
      bərpa edir və m.115 limitinə tabedir, dəyər artımı isə aktivi
      <strong>böyüdür</strong> — tam məbləğ ilkin dəyərə və amortizasiya
      bazasına əlavə olunur, limit tətbiq edilmir.<br>
      Vergi baxımından hansı halın hansına aid olması —
      <strong>CLAUDE.md §12.8, həll olunmayıb</strong>.</div>`,
    d => post('addition.add', d), 'Əlavə et');
}

/* ---- rate election ---- */
function formElection(cat, card){
  const ri = card ? card.rate_info : cat.rate;
  const target = card ? `ƏV: ${card.inv_no || card.name}` : `Kateqoriya: ${cat.name_az}`;
  openModal('Amortizasiya dərəcəsi',
    `<input type="hidden" name="year" value="${REPORT.year}">
     <input type="hidden" name="category" value="${cat.code}">
     ${card ? `<input type="hidden" name="asset_id" value="${card.asset_id}">` : ''}
     <div class="h" style="margin-bottom:12px">${esc(target)}</div>` +
    fld('applied_rate','Tətbiq olunan dərəcə',
        {value:(parseFloat(ri.applied)*100).toFixed(0),
         hint:`m.114.3 norması ${pct(ri.statutory_max)} · sahibkar əmsalı
               ×${ri.coefficient} · yuxarı hədd <strong>${pct(ri.ceiling)}</strong>.
               Faizlə yazın (məs. 25 və ya 50). Boş buraxsanız seçim silinir və
               norma (${pct(ri.statutory_max)}) tətbiq olunur.`}),
    d => post('election.set', d));
}

/* ---- asset history ("лицевой счёт") ----
   Every year of one asset recomputed from the events, so it can never drift
   from the yearly reports. */
async function showHistory(id){
  closeDrawer();
  const slug = document.getElementById('client').value;
  const h = await (await fetch(`/api/asset-history?client=${slug}&asset_id=${id}`)).json();
  if (h.error) return fail(h.error);
  const a = h.asset;
  const last = h.years[h.years.length - 1];

  const ev = h.events.map(e => `<tr><td class="d">${esc(e.date)}</td>
    <td>${esc(e.kind)}</td><td class="num">${e.amount ? money(e.amount) : ''}</td>
    <td>${esc(e.note||'')}</td></tr>`).join('');

  const yr = h.years.map(y => `<tr class="${y.written_off ? 'warn'
      : y.disposal_type ? 'next' : ''}">
    <td><strong>${y.year}</strong>${y.closed ? '<span class="tag d">bağlı</span>' : ''}</td>
    <td class="num">${money(y.opening)}</td>
    <td class="num">${money(y.acquisition)}</td>
    <td class="num">${money(y.addition)}</td>
    <td class="num">${money(y.repair_capitalized)}</td>
    <td class="num">${money(y.disposed)}</td>
    <td class="num">${money(y.base)}</td>
    <td class="num">${parseFloat(y.rate) ? pct(y.rate) : '<span class="zero">—</span>'}</td>
    <td class="num"><strong>${money(y.depreciation)}</strong></td>
    <td class="num">${money(y.writeoff)}</td>
    <td class="num">${money(y.closing)}</td>
    <td class="num">${money(y.accumulated_end)}</td></tr>`).join('');

  const totDep = h.years.reduce((s,y) => s + parseFloat(y.depreciation), 0);
  const totAdd = h.years.reduce((s,y) => s + parseFloat(y.addition), 0);

  document.getElementById('view').innerHTML = `
    <div class="card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
        <div><h2 style="margin:0;font-size:17px;background:none;color:inherit;padding:0">
            ${esc(a.inv_no ? a.inv_no + ' · ' : '')}${esc(a.name)}</h2>
          <div class="hint">${esc(a.category_name)}
            ${a.in_date ? '· alınıb ' + esc(a.in_date) : ''}
            ${a.counterparty ? '· ' + esc(a.counterparty) : ''}</div></div>
        <button class="ghost" onclick="TAB='annual';render()">← hesabata qayıt</button>
      </div>
      <div class="kpis" style="margin:14px 0 0">
        <div class="kpi"><div class="k">İlkin dəyər</div>
          <div class="v">${money(a.cost)}</div></div>
        <div class="kpi"><div class="k">Dəyər artımı (cəmi)</div>
          <div class="v">${fmt.format(totAdd)}</div></div>
        <div class="kpi"><div class="k">Yığılmış amortizasiya</div>
          <div class="v">${fmt.format(totDep)}</div></div>
        <div class="kpi hi"><div class="k">Qalıq dəyər</div>
          <div class="v">${last ? fmt.format(parseFloat(last.closing)) : '—'}</div></div>
      </div>
    </div>

    <h3>İllər üzrə hərəkət</h3>
    <div class="card"><div class="scroll"><table><thead><tr>
      <th>İl</th><th class="num">Qalıq (əvvəl)</th><th class="num">Daxilolma</th>
      <th class="num">Dəyər artımı</th><th class="num">Kapital. təmir</th>
      <th class="num">Xaricetmə</th><th class="num">Baza</th><th class="num">Dərəcə</th>
      <th class="num">Amortizasiya</th><th class="num">Silinmə</th>
      <th class="num">Qalıq (son)</th><th class="num">Yığılmış</th>
    </tr></thead><tbody>${yr}</tbody></table></div></div>

    <h3>Əməliyyatlar</h3>
    <div class="card"><div class="scroll"><table><thead><tr>
      <th>Tarix</th><th>Əməliyyat</th><th class="num">Məbləğ</th><th>Qeyd</th>
    </tr></thead><tbody>${ev}</tbody></table></div></div>

    <div class="note q">Bu hesabat saxlanmır — hər dəfə hadisələrdən yenidən
      hesablanır, ona görə illik hesabatlarla heç vaxt ayrıla bilməz (§2).</div>`;
  document.getElementById('side').innerHTML = '';
}

/* ---- bulk import ----------------------------------------------------
   Excel is where every client's asset list already lives, so the fast path
   is: select the range, Ctrl+C, paste. A file picker is the fallback.
   The preview runs through the SAME server code as the real import and then
   rolls back, so what it shows is exactly what will happen. --------------- */
let IMP = null;

function formImport(){
  IMP = {step:1, header:[], rows:[], map:{}, catmap:{}, year:REPORT.year, fields:[]};
  impRender();
}

function impBox(step, body, foot){
  const bar = ['Yapışdır / fayl','Sütunları uyğunlaşdır','Baxış və idxal']
    .map((t,i) => `<span class="${i+1===step?'on':''}">${i+1}. ${t}</span>`).join('');
  document.getElementById('mtitle').textContent = 'ƏV idxalı';
  document.getElementById('mbody').innerHTML = `<div class="stepbar">${bar}</div>` + body;
  document.getElementById('ferr').style.display = 'none';
  document.getElementById('msubmit').textContent = foot;
  document.querySelector('#modal .box').classList.toggle('wide', step > 1);
  document.getElementById('modal').classList.add('open');
}

const STAY = '__stay__';

function impRender(){
  if (IMP.step === 1){
    impBox(1, `
      <div class="fld"><label>Excel-dən kopyalayıb bura yapışdırın</label>
        <textarea class="paste" id="pastebox"
          placeholder="Excel-də sahəni seçin → Ctrl+C → burada Ctrl+V"></textarea>
        <div class="h">Birinci sətir başlıq olmalıdır.</div></div>
      <div class="fld"><label>…və ya fayl seçin (.xlsx, .csv, .tsv)</label>
        <input type="file" id="impfile" accept=".xlsx,.csv,.tsv,.txt"></div>`,
      'Davam et');
    MSUBMIT = async () => {
      const f = document.getElementById('impfile').files[0];
      let payload;
      if (f){
        const b64 = await new Promise(res => {
          const fr = new FileReader();
          fr.onload = () => res(fr.result.split(',')[1]);
          fr.readAsDataURL(f);
        });
        payload = {name:f.name, b64};
      } else {
        const text = document.getElementById('pastebox').value;
        if (text.split(/\r?\n/).filter(l => l.trim()).length < 2)
          throw new Error('Ən azı başlıq və bir sətir lazımdır');
        payload = {name:'paste.tsv', b64: btoa(unescape(encodeURIComponent(text)))};
      }
      const r = await fetch('/api/parse-file', {method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      IMP.header = j.header; IMP.rows = j.rows; IMP.map = j.guess; IMP.fields = j.fields;
      IMP.step = 2; impRender();
      throw new Error(STAY);
    };
    return;
  }

  if (IMP.step === 2){
    const opts = f => ['<option value="">—</option>'].concat(
      IMP.header.map((h,j) => `<option value="${j}" ${IMP.map[f]===j?'selected':''}>${
        esc(h) || ('sütun ' + (j+1))}</option>`)).join('');
    const LBL = {inv_no:'İnv.№', name:'Adı *', category:'Kateqoriya *',
      in_date:'Alış tarixi', cost:'İlkin dəyər', opening_residual:'Qalıq dəyər',
      counterparty:'Kontragent', note:'Qeyd'};
    const cols = IMP.fields.map(f => `<div class="fld"><label>${LBL[f]||f}</label>
      <select data-f="${f}">${opts(f)}</select></div>`).join('');

    const ci = IMP.map.category;
    const seen = ci == null ? [] :
      [...new Set(IMP.rows.map(r => (r[ci]||'').trim()).filter(Boolean))];
    const cl = CTX.categories.filter(c => !c.code.startsWith('qma'));
    const catsel = seen.map(v => `<div class="fld"><label>${esc(v)}</label>
      <select data-cat="${esc(v)}">${cl.map(c => `<option value="${c.code}" ${
        (c.code === v.toLowerCase() || c.name_az === v) ? 'selected' : ''
      }>${esc(c.name_az)}</option>`).join('')}</select></div>`).join('');

    impBox(2, `<div class="h" style="margin-bottom:10px">${IMP.rows.length} sətir tapıldı.
        Hər sahəni mənbə sütunu ilə uyğunlaşdırın.</div>
      <div class="imp-grid">${cols}</div>
      ${seen.length ? `<h3>Kateqoriyaların uyğunlaşdırılması</h3>
        <div class="imp-grid">${catsel}</div>` : ''}
      <div class="fld" style="max-width:240px;margin-top:14px">
        <label>Qalıq dəyər hansı ilin əvvəlinə</label>
        <input type="number" id="impyear" value="${IMP.year}"></div>`,
      'Baxış');
    MSUBMIT = async () => {
      IMP.map = {};
      document.querySelectorAll('#mbody select[data-f]').forEach(el => {
        if (el.value !== '') IMP.map[el.dataset.f] = +el.value;
      });
      IMP.catmap = {};
      document.querySelectorAll('#mbody select[data-cat]').forEach(el => {
        IMP.catmap[el.dataset.cat] = el.value;
      });
      IMP.year = +document.getElementById('impyear').value;
      if (IMP.map.name == null) throw new Error('«Adı» sütunu seçilməyib');
      if (IMP.map.category == null) throw new Error('«Kateqoriya» sütunu seçilməyib');
      IMP.step = 3;
      await impPreview();
      throw new Error(STAY);
    };
  }
}

const impPayload = () => IMP.rows.map(r => {
  const o = {};
  for (const f of Object.keys(IMP.map)) o[f] = (r[IMP.map[f]] ?? '').toString().trim();
  o.category = IMP.catmap[o.category] || o.category;
  return o;
});

async function impPreview(){
  const rep = (await post('asset.import',
    {rows: impPayload(), opening_year: IMP.year, dry_run: true})).result;
  const bad = rep.errors.length;
  const body = `
    <div class="h" style="margin-bottom:8px">${bad
      ? `<strong style="color:var(--neg)">${bad} sətirdə xəta.</strong>
         İdxal ya bütövlükdə keçir, ya da heç keçmir — düzəldib yenidən cəhd edin.`
      : `<strong style="color:var(--pos)">${rep.created} ƏV idxala hazırdır.</strong>`}
    </div>
    <div class="scroll imp" style="max-height:46vh"><table><thead><tr>
      <th>#</th><th>İnv.№</th><th>Adı</th><th>Kateqoriya</th>
      <th class="num">İlkin dəyər</th><th class="num">Qalıq</th>
      <th>Rejim</th><th>Nəticə</th></tr></thead><tbody>${
      rep.rows.map(r => `<tr class="${r.ok?'good':'bad'}">
        <td>${r.line}</td><td>${esc(r.inv_no)}</td><td>${esc(r.name)}</td>
        <td>${esc(r.category||'')}</td>
        <td class="num">${r.cost ? money(r.cost) : ''}</td>
        <td class="num">${r.residual ? money(r.residual) : ''}</td>
        <td>${r.mode==='carried'?'əvvəlki illərdən':r.mode==='new'?'bu il alınıb':''}</td>
        <td>${r.ok ? '✓' : esc(r.message)}</td></tr>`).join('')}</tbody></table></div>`;
  impBox(3, body, bad ? 'Geri qayıt' : `${rep.created} ƏV idxal et`);
  MSUBMIT = async () => {
    if (bad){ IMP.step = 2; impRender(); throw new Error(STAY); }
    await post('asset.import', {rows: impPayload(), opening_year: IMP.year});
  };
}

/* ---- taxpayer status ---- */
function formStatus(year){
  // Reachable before any report exists, so it cannot read REPORT.
  const y = year || REPORT.year;
  const cur = REPORT ? REPORT.status : 'mikro';
  openModal(`Sahibkarlıq statusu — ${y}`,
    `<input type="hidden" name="year" value="${y}">` +
    fld('status','Status',{type:'select',req:true,options:
      [['mikro','Mikro sahibkar (×2)'],['kicik','Kiçik sahibkar (×1.5)'],
       ['orta','Orta sahibkar (×1)'],['iri','İri sahibkar (×1)']]
      .map(([v,t]) => `<option value="${v}" ${v===cur?'selected':''}>${t}</option>`).join('')}) +
    fld('basis','Əsas',{placeholder:'İllik dövriyyə, işçi sayı…',
        hint:'Əmsal hüquqdur, məcburiyyət deyil: status onu yalnız yuxarı həddi '
           + 'qaldırır, tətbiq etmək üçün dərəcəni ayrıca seçmək lazımdır.'}),
    d => post('status.set', d));
}

/* ---- write-off decision & delete ---- */
function toggleWriteoff(card, on){
  openModal(on ? '500/5% silinməsi' : 'Silinmə qərarını ləğv et',
    `<input type="hidden" name="asset_id" value="${card.asset_id}">
     <input type="hidden" name="year" value="${REPORT.year}">
     <input type="hidden" name="enabled" value="${on ? '1' : ''}">
     <div class="h" style="margin-bottom:12px">${esc(card.threshold_reason)}</div>` +
    (on ? fld('reason','Əsas',{value:'VM m.114 — 500/5% həddi, birdəfəlik silinmə'})
        : '<div class="h">Silinmə qərarı silinəcək, ƏV adi qaydada amortizasiya olunacaq.</div>'),
    d => post('writeoff.set', {...d, enabled: on}), on ? 'Sil' : 'Ləğv et');
}

function confirmDelete(card){
  openModal(`ƏV silinsin? — ${card.inv_no || card.name}`,
    `<input type="hidden" name="asset_id" value="${card.asset_id}">
     <div class="h">Bu ƏV ilə birlikdə ona aid <strong>bütün</strong> sətirlər
     silinir: açılış qalığı, xaricetmə, təmir, silinmə qərarı, fərdi dərəcə.
     Əməliyyatdan əvvəl ehtiyat nüsxə götürülür.</div>`,
    d => post('asset.delete', d), 'Sil');
}

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true'); TAB = b.dataset.tab; render();
});
document.getElementById('filter').oninput = e => { FILTER = e.target.value.trim().toLowerCase(); render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && e.target.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('filter').focus(); }
  if (e.key === 'Escape') closeDrawer();
});
boot();
</script>
