<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Əsas Vəsaitlər — Amortizasiya</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header>
  <div class="brand">Əsas Vəsaitlər<small id="sub">yüklənir…</small></div>
  <select id="client"></select>
  <select id="year"></select>
  <div class="spacer"></div>
  <span class="ver" id="ver"></span>
  <button class="btn" onclick="formClient()">+ Müştəri</button>
  <button class="btn" onclick="formSettings()" title="Firmanın parametrləri">⚙</button>
  <button class="btn" onclick="formBaza()">⇄ Baza</button>
  <button class="btn" onclick="formAsset()">+ Yeni ƏV</button>
  <button class="btn" onclick="formImport()">⇪ İdxal</button>
  <a class="btn" id="export" href="#">⬇ Excel-ə ixrac</a>
</header>

<!-- Outside #error/#view/#side/#kpis on purpose: those are rebuilt by
     load()/fail() every time the client or year changes (base.js), which
     would silently drop a warning that must stay up until the user acts on
     it or dismisses it themselves. -->
<div id="updateProblem" style="display:none"></div>

<!-- No click-outside-to-close: the box does not fill the backdrop (padding,
     centered, a short grid does not reach 88vh), so a stray click while
     switching windows -- Excel open alongside, mid-paste -- landed on the
     backdrop and silently discarded an in-progress import with no undo.
     Closing stays explicit: the ✕ or "İmtina" button. -->
<div class="modal" id="modal">
  <div class="box">
    <h2><span id="mtitle">—</span>
      <button class="closebtn" onclick="closeModal()">✕</button></h2>
    <form id="mform" onsubmit="return submitModal(event)">
      <div class="ferr" id="ferr"></div>
      <div id="mbody"></div>
      <div class="foot">
        <button type="button" class="ghost" onclick="closeModal()">İmtina</button>
        <button type="submit" class="primary" id="msubmit">Yadda saxla</button>
      </div>
    </form>
  </div>
</div>

<main>
  <div id="error" style="display:none" class="err"></div>
  <div id="kpisnote" class="hint" style="margin-bottom:6px"></div>
  <div class="kpis" id="kpis"></div>

  <div id="carry"></div>

  <div class="toolbar">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="annual" aria-selected="true">İllik hesabat</button>
      <button role="tab" data-tab="declaration" aria-selected="false">Bəyannamə</button>
      <button role="tab" data-tab="monthly" aria-selected="false">Aylıq</button>
      <button role="tab" data-tab="repair" aria-selected="false">Təmir (m.115)</button>
      <button role="tab" data-tab="norms" aria-selected="false">Normalar</button>
      <button role="tab" data-tab="ratematrix" aria-selected="false">Dərəcələr — illər üzrə</button>
      <button role="tab" data-tab="threshold" aria-selected="false">500/5% <span id="thrcount"></span></button>
      <button role="tab" data-tab="notes" aria-selected="false">Qeydlər <span id="notecount"></span></button>
    </div>
    <input class="filter" id="filter" placeholder="Axtar:  ad, inv.№, kontragent…   ( / )">
    <span class="hint" id="hint"></span>
  </div>

  <div class="layout">
    <nav class="side" id="side"></nav>
    <div id="view"></div>
  </div>
</main>

<aside class="drawer" id="drawer">
  <header><strong id="dtitle">—</strong><div class="spacer"></div>
    <button class="closebtn" onclick="closeDrawer()">Bağla</button></header>
  <div class="body" id="dbody"></div>
</aside>


<!-- Plain <script> tags in order, not modules: the markup wires
     buttons with onclick="...", which resolves against the global
     scope. Under type="module" every one of those handlers would go
     undefined. boot.js is last because it starts the page. -->
<script src="/static/base.js"></script>
<script src="/static/clients.js"></script>
<script src="/static/rates.js"></script>
<script src="/static/report.js"></script>
<script src="/static/table.js"></script>
<script src="/static/card.js"></script>
<script src="/static/groups.js"></script>
<script src="/static/forms.js"></script>
<script src="/static/import.js"></script>
<script src="/static/boot.js"></script>
</body>
</html>
