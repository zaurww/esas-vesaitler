                : ''});
      // Neither figure enters the calculation; both are here because the card
      // is also where an accountant comes to answer "which invoice was this
      // on" and "which of the forty units is it". Optional on purpose --
      // plenty of clients keep neither.
      h += `<div class="row2">
        ${fld('counterparty','Kontragent',{value:card&&card.counterparty})}
        ${fld('e_qaime','E-qaimə №',{value:card&&card.e_qaime,
              placeholder:'ixtiyari'})}</div>`;
      // A batch shares its e-invoice but not its serials: the serial is what
      // tells the units apart, so offering one box for forty cards would
      // record something untrue about thirty-nine of them.
      h += fld('serial_no','Seriya № / VIN',{value:card&&card.serial_no,
            placeholder:'ixtiyari',
            hint: edit ? '' : 'Say 1-dən çoxdursa boş qalır — seriya nömrəsi '
               + 'hər ədəd üçün fərqlidir, sonra kartlarda ayrıca yazılır.'});
      // Buying the same thing many times over. One card per object is not
      // tidiness: m.114.8 tests each object separately, so 240 refrigerators
      // at 400 AZN fall under the threshold one by one, while a single
      // 96 000 AZN line never would.
      if (!edit){
        h += `<div class="row2">
          <div class="fld"><label>Say</label>
            <input name="say" type="number" min="1" step="1" value="1">
            <div class="h">Eyni əşyadan neçə ədəd alınıb. Hər ədəd üçün
              <strong>ayrıca kart</strong> yaradılır — m.114.8 həddi hər obyekt
              üzrə ayrıca yoxlanılır.</div></div>
          <div class="fld"><label>Cəmi</label>
            <div id="batchsum" class="h" style="font-size:14px;padding-top:9px">—</div>
            <div class="h">«İlkin dəyər» və «Qalıq dəyər» — bir ədəd üçündür.
              İnv.№-lər ardıcıl verilir.</div></div></div>`;
      }
    } else {
      h += fld('name','Adı',{placeholder:'avtomatik: «kateqoriya — qrup qalığı»',
              hint:'Kartsız qrup qalığı: inventar nömrəsi, tarix və ilkin dəyər olmur. '
                 + '5% testi tətbiq edilmir, yalnız 500 AZN.'});
    }
    if (!edit && mode !== 'new'){
      h += `<div class="row2">
        ${fld('opening_residual',`Qalıq dəyər — ${year} ilin əvvəlinə (AZN)`,
              {type:'number',step:'0.01',req:true})}
        ${fld('opening_year','İl',{type:'number',value:year,req:true})}</div>`;
    }
    // The opening residual is editable from here too -- a figure typed wrong
    // during import is corrected where it is read. Only when it IS a stored
    // fact: a residual carried from last year is computed (§2), and putting a
    // computed number in a form would turn it into stored data the moment
    // someone pressed save. For that case, point at the deliberate act.
    if (edit && card.opening_source === 'explicit'){
      h += `<input type="hidden" name="opening_edit" value="1">
            <input type="hidden" name="opening_year" value="${year}">` +
        fld('opening_residual',`Qalıq dəyər — ${year} ilin əvvəlinə (AZN)`,
            {type:'number',step:'0.01',value:card.opening,
             hint:'Əl ilə daxil edilmiş açılış qalığı (idxal da bura yazır). '
                + 'Boş buraxsanız sətir silinir və qalıq əvvəlki ildən hesablanır.'});
    }
    if (edit && card.opening_source === 'carried'){
      h += `<div class="fld"><div class="h">Qalıq (${year} ilin əvvəlinə)
        <strong>${money(card.opening)}</strong> — əvvəlki ildən hesablanıb,
        saxlanılan rəqəm deyil, ona görə burada redaktə olunmur. Bu il üçün
        onu əl ilə təyin etmək lazımdırsa: «Açılış qalığı».</div></div>`;
    }
    h += fld('note','Qeyd',{value:card&&card.note});
    openModal(edit ? `ƏV redaktəsi — ${card.inv_no || card.name}` : 'Yeni ƏV', h,
      d => post(edit ? 'asset.update' : 'asset.create', d),
      edit ? 'Yadda saxla' : 'Əlavə et');
    // Assigned rather than added: render() runs again on every mode switch,
    // and addEventListener would stack a handler each time.
    document.getElementById('mbody').oninput = batchTotal;
    batchTotal();
  };
  window.ASSETMODE = m => { mode = m; render(); };
  render();
}

/* Inventory numbers come from the office, often out of 1C, so the app
   follows whatever scheme is already in use instead of imposing one: it
   reads the prevailing prefix and padding of the category and steps the
   counter. Always a suggestion, never enforced. */
async function suggestInv(){
  const cat = document.querySelector('#mbody select[name=category]').value;
  const slug = document.getElementById('client').value;
  const r = await fetch(`/api/next-inv?client=${slug}&category=${cat}`);
  const j = await r.json();

/* ---- rate election ---- */
function formElection(cat, card){
  const ri = card ? card.rate_info : cat.rate;
  const target = card ? `ƏV: ${card.inv_no || card.name}` : `Kateqoriya: ${cat.name_az}`;
  // Two shortcuts, because these are the only two figures the law actually
  // names: the plain article 114.3 norm, and that norm times the
  // entrepreneur coefficient. Typing 37.5 by hand is where the rounding bug
  // used to bite, and the ceiling is the whole point of having a status.
  const quick = [['m.114.3 norması', ri.statutory_max]]
    .concat(parseFloat(ri.coefficient) > 1 ? [['yuxarı hədd', ri.ceiling]] : [])
    .map(([l, v]) => `<button type="button" class="ghost"
       style="padding:8px 12px;white-space:nowrap" onclick="SETRATE('${pctnum(v)}')"
       >${l} ${pct(v)}</button>`).join('');
  openModal('Amortizasiya dərəcəsi',
    `<input type="hidden" name="year" value="${REPORT.year}">
     <input type="hidden" name="category" value="${cat.code}">
     ${card ? `<input type="hidden" name="asset_id" value="${card.asset_id}">` : ''}
     <div class="h" style="margin-bottom:12px">${esc(target)}</div>
     <div class="fld"><label>Tətbiq olunan dərəcə</label>
       <div style="display:flex;gap:6px">
         <input name="applied_rate" value="${pctnum(ri.applied)}">${quick}</div>
       <div class="h">m.114.3 norması ${pct(ri.statutory_max)} · sahibkar əmsalı
         ×${ri.coefficient} · yuxarı hədd <strong>${pct(ri.ceiling)}</strong>.
         Faizlə yazın (məs. 25 və ya 37.5). Boş buraxsanız seçim silinir və
         norma (${pct(ri.statutory_max)}) tətbiq olunur.
         ${card ? '' : 'Ayrı-ayrı ƏV üçün seçilmiş fərdi dərəcə qüvvədə qalır.'}</div>
     </div>`,
    d => post('election.set', d));
}
window.SETRATE = v => {
  const box = document.querySelector('#mbody input[name=applied_rate]');
  box.value = v; box.focus();
};

/* ---- bulk import ----------------------------------------------------
   Designed around what a bookkeeper sees, not around the schema.

   The first version asked "which column is the name?" with a grid of field
   dropdowns -- that is the developer's model. A bookkeeper looks at the
   sheet and says "this column here is the name", so the mapping step now
   shows THEIR rows with a dropdown sitting on top of each column.

   And when every required column is recognised, the step is skipped
   entirely: a decision nobody needs to make should not be shown. --------- */
let IMP = null;

const IMP_LABELS = {
  inv_no:'İnv.№', name:'Adı', category:'Kateqoriya', in_date:'Alış tarixi',
  cost:'İlkin dəyər', opening_residual:'Qalıq dəyər',
  counterparty:'Kontragent', e_qaime:'E-qaimə №', serial_no:'Seriya №',
  note:'Qeyd'};
const IMP_REQUIRED = ['name','category'];

function formImport(){
  IMP = {step:1, header:[], rows:[], map:{}, catmap:{}, year:REPORT.year,
         fields:[], grid:null, back:null};
  impRender();
}

function impBox(step, body, foot, back){
  const steps = ['Cədvəli gətirin','Sütunları yoxlayın','Baxış və idxal'];
  document.getElementById('mtitle').textContent =
    `ƏV idxalı · ${step}/3 · ${steps[step-1]}`;
  document.getElementById('mbody').innerHTML = body;
  document.getElementById('ferr').style.display = 'none';
  document.getElementById('msubmit').textContent = foot;
  const cancel = document.querySelector('#mform .foot .ghost');
  cancel.textContent = back ? '← Geri' : 'İmtina';
  cancel.onclick = back ? back : closeModal;
  document.querySelector('#modal .box').classList.toggle('wide', step > 1);
  document.getElementById('modal').classList.add('open');
}

const STAY = '__stay__';
const impCats = () => CTX.categories.filter(c => !c.code.startsWith('qma'));

/* ---- step 1: get the sheet in ---- */
function impRender(){
  impBox(1, `
    <p style="margin:0 0 14px">Müştərinin cədvəlini olduğu kimi gətirin —
      sütunların adı və sırası vacib deyil, proqram özü tanıyacaq.</p>
    <div class="fld"><label>Excel-də sahəni seçin → <kbd>Ctrl+C</kbd> →
      burada <kbd>Ctrl+V</kbd></label>
      <textarea class="paste" id="pastebox"
        placeholder="Buraya yapışdırın…"></textarea></div>
    <div class="fld"><label>və ya faylı seçin</label>
      <input type="file" id="impfile" accept=".xlsx,.csv,.tsv,.txt"></div>
    <div class="h">Birinci sətir sütun adları olmalıdır.
      Müştəridə cədvəl yoxdursa —
      <a href="/api/import-template">hazır şablonu yükləyib</a> ona göndərin.</div>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <div class="fld"><label>Sütunlar tanınmırsa</label>
      <div class="h" style="margin:0 0 8px">Cədvəli bütöv gətirmək əvəzinə
        hazır sütunları <strong>bir-bir doldurun</strong>: Excel-də bir sütunu
        seçib köçürün və buradakı müvafiq sütuna yapışdırın. Uyğunlaşdırma
        addımı olmur — hara yapışdırdınız, ora düşür.</div>
      <button type="button" class="btn" onclick="impGrid()"
        >⌗ Sütun-sütun doldurun</button></div>`,
    'Davam et');
  MSUBMIT = async () => {
    const f = document.getElementById('impfile').files[0];
    let payload;
    if (f){
      const b64 = await new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result.split(',')[1]);
        fr.readAsDataURL(f);
      });
      payload = {name:f.name, b64};
    } else {
      const text = document.getElementById('pastebox').value;
      if (text.split(/\r?\n/).filter(l => l.trim()).length < 2)
        throw new Error('Ən azı başlıq sətri və bir ƏV sətri lazımdır');
      payload = {name:'paste.tsv', b64: btoa(unescape(encodeURIComponent(text)))};
    }
    const r = await fetch('/api/parse-file', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error);
    IMP.header = j.header; IMP.rows = j.rows; IMP.map = j.guess; IMP.fields = j.fields;
    impAfterParse();
    throw new Error(STAY);
  };
}

/* Skip the mapping step when there is nothing to decide. */
function impAfterParse(){
  const ok = IMP_REQUIRED.every(f => IMP.map[f] != null);
  IMP.catmap = {};
  const unknown = impUnknownCats();
  if (ok && !unknown.length){ impPreview(); } else { impColumns(); }
}

function impUnknownCats(){
  const ci = IMP.map.category;
  if (ci == null) return [];
  const known = new Set(impCats().map(c => c.code));
  const seen = new Map();
  for (const r of IMP.rows){
    const v = (r[ci] || '').trim();
    if (!v || known.has(v)) continue;
    seen.set(v, (seen.get(v) || 0) + 1);
  }
  return [...seen.entries()];
}

/* ---- step 2: their rows, with a dropdown over each column ---- */
function impColumns(){
  IMP.step = 2;
  const opts = i => `<select onchange="impSetCol(${i}, this.value)">
      <option value="">— istifadə olunmur —</option>
      ${IMP.fields.map(f => `<option value="${f}" ${IMP.map[f] === i ? 'selected' : ''}
        >${IMP_LABELS[f]}${IMP_REQUIRED.includes(f) ? ' *' : ''}</option>`).join('')}
    </select>`;
  const missing = IMP_REQUIRED.filter(f => IMP.map[f] == null);
  const sample = IMP.rows.slice(0, 5);
  const table = `<div class="scroll imp" style="max-height:34vh"><table>
    <thead>
      <tr>${IMP.header.map((h,i) => `<th style="min-width:150px">${opts(i)}</th>`).join('')}</tr>
      <tr>${IMP.header.map(h => `<th style="font-weight:400;text-transform:none;
        color:var(--muted)">${esc(h) || '(adsız sütun)'}</th>`).join('')}</tr>
    </thead>
    <tbody>${sample.map(r => `<tr>${IMP.header.map((_,i) =>
      `<td>${esc(r[i] ?? '')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  const unknown = impUnknownCats();
  const cats = unknown.length ? `<h3>Kateqoriyalar tanınmadı</h3>
    <p class="h" style="margin:0 0 8px">Cədvəldəki bu dəyərlərin hansı
      kateqoriyaya uyğun gəldiyini göstərin.</p>
    <div class="imp-grid">${unknown.map(([v,n]) => `<div class="fld">
      <label>«${esc(v)}» — ${n} sətir</label>
      <select data-cat="${esc(v)}" required>
        <option value="">— seçin —</option>
        ${impCats().map(c =>
          `<option value="${c.code}">${esc(c.name_az)}</option>`).join('')}</select>
      </div>`).join('')}</div>` : '';

  impBox(2, `
    <p style="margin:0 0 12px">${IMP.rows.length} sətir oxundu.
      ${missing.length
        ? `<strong style="color:var(--neg)">Hər sütunun üstündə onun nə olduğunu
           seçin.</strong> Tanınmayan sütunları «istifadə olunmur» kimi buraxın.`
        : 'Proqram sütunları özü tanıdı — yoxlayın və davam edin.'}
      <br><span class="h">* — mütləq lazımdır</span></p>
    ${table}${cats}
    <div class="fld" style="max-width:260px;margin-top:14px">
      <label>«Qalıq dəyər» hansı ilin əvvəlinə aiddir</label>
      <input type="number" id="impyear" value="${IMP.year}"></div>`,
    'Baxış', () => { IMP.step = 1; impRender(); });

  MSUBMIT = async () => {
    const unset = [];
    document.querySelectorAll('#mbody select[data-cat]').forEach(el => {
      if (!el.value) unset.push(el.dataset.cat);
      IMP.catmap[el.dataset.cat] = el.value;
    });
    if (unset.length)
      throw new Error('Kateqoriya seçilməyib: ' + unset.join(', '));
    IMP.year = +document.getElementById('impyear').value;
    const miss = IMP_REQUIRED.filter(f => IMP.map[f] == null);
    if (miss.length)
      throw new Error('Seçilməyib: ' + miss.map(f => IMP_LABELS[f]).join(', '));
    await impPreview();
    throw new Error(STAY);
  };
}

/* One field belongs to one column: assigning it elsewhere frees the old one. */
function impSetCol(index, field){
  for (const f of Object.keys(IMP.map)) if (IMP.map[f] === index) delete IMP.map[f];
  if (field) IMP.map[field] = index;
  impColumns();
}

const impPayload = () => IMP.rows.map(r => {
  const o = {};
  for (const f of Object.keys(IMP.map)) o[f] = (r[IMP.map[f]] ?? '').toString().trim();
  o.category = IMP.catmap[o.category] || o.category;
  return o;
});

/* ---- step 3: plain-language check ---- */
/* ---- alternative to step 2: fixed columns, filled one paste at a time ----

   The mapping step exists because a client's sheet has whatever columns it
   has. When that guessing goes wrong it is genuinely hard to recover from --
   so this offers the other direction: the columns are ours and fixed, and the
   user says where a column of values belongs by pasting it there. Nothing to
   map, nothing to guess.

   Excel puts TSV on the clipboard, so a rectangular selection pastes as a
   rectangle here. The whole grid is just a way of building the same `rows`
   payload the file import already sends, which is why it can jump straight
   to the shared preview. */
const GRID_COLS = ['category','inv_no','name','in_date','cost',
                   'opening_residual','counterparty','e_qaime','serial_no'];

function impGrid(rows){
  IMP.step = 2; IMP.back = impGrid;
  const data = rows || IMP.grid || [];
  while (data.length < 15) data.push(GRID_COLS.map(() => ''));
  IMP.grid = data;

  const cell = (r, c) => GRID_COLS[c] === 'category'
    ? `<select data-r="${r}" data-c="${c}">${
        impCats().map(k => `<option value="${k.code}"
          ${data[r][c] === k.code ? 'selected' : ''}>${esc(k.code)}</option>`).join('')
      }</select>`
    : `<input data-r="${r}" data-c="${c}" value="${val(data[r][c])}"
        ${GRID_COLS[c] === 'in_date' ? 'placeholder="GG.AA.YYYY"' : ''}>`;

  impBox(2, `
    <div class="note">Excel-də <strong>bir sütunu</strong> seçin →
      <kbd>Ctrl+C</kbd> → burada həmin sütunun birinci xanasına
      <kbd>Ctrl+V</kbd>. Bir neçə sütunu birdən də yapışdıra bilərsiniz.
      Boş sətirlər nəzərə alınmır.</div>
    <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:10px">
      <div class="fld" style="margin:0">
        <label>Bütün sətirlərin kateqoriyası</label>
        <select onchange="impGridAllCats(this.value)">
          <option value="">— dəyişmə —</option>
          ${impCats().map(k => `<option value="${k.code}">${esc(k.code)} · ${esc(k.name_az)}</option>`).join('')}
        </select></div>
      <div class="fld" style="margin:0;max-width:150px">
        <label>Qalıq hansı ilin əvvəlinə</label>
        <input id="gridyear" type="number" value="${IMP.year}"
          onchange="IMP.year = parseInt(this.value,10) || IMP.year"></div>
      <button type="button" class="ghost" style="padding:9px 14px"
        onclick="impGridAdd(20)">+ 20 sətir</button>
    </div>
    <div class="scroll imp grid" style="max-height:40vh" id="gridwrap"
      onpaste="return impGridPaste(event)" oninput="impGridTotals()">
      <table><thead><tr><th>Kat.</th><th>İnv.№</th><th>Adı *</th>
        <th>Alış tarixi</th><th class="num">İlkin dəyər</th>
        <th class="num">Qalıq (${IMP.year} əvvəlinə)</th>
        <th>Kontragent</th></tr></thead><tbody id="gridbody">${
        data.map((row, r) => `<tr>${row.map((_, c) =>
          `<td>${cell(r, c)}</td>`).join('')}</tr>`).join('')}</tbody>
      <tfoot><tr>
        <td colspan="4" id="gridcount"></td>
        <td class="num" id="gridsumcost"></td>
        <td class="num" id="gridsumres"></td>
        <td id="gridbad"></td></tr></tfoot></table></div>
    <div class="h">«Adı» məcburidir. «İlkin dəyər» olmadan 500/5% testinin
      yalnız məbləğ hissəsi işləyəcək — bilirsinizsə, yazın.<br>
      Cəmi sətri Excel-dəki cəmi ilə tutuşdurun — sütun düz düşübsə,
      rəqəmlər üst-üstə düşməlidir.</div>`,
    'Baxış', () => impRender());
  impGridTotals();

  MSUBMIT = async () => {
    impGridRead();
    if (!IMP.grid.some(impGridFilled))
      throw new Error('Heç bir sətir doldurulmayıb');
    IMP.rows = IMP.grid.filter(impGridFilled);
    IMP.map = {}; GRID_COLS.forEach((f, i) => { IMP.map[f] = i; });
    IMP.catmap = {};
    await impPreview();
    throw new Error(STAY);
  };
}

/* The point of pasting a whole column is that you already know its total from
   Excel. Showing ours under the column turns "did it land right?" into a
   glance instead of a scroll.

   These rules mirror mutate._normalise_number deliberately, including its
   refusal to guess at "1,234". The engine stays the authority -- the preview
   step re-parses everything server-side before anything is written -- so if
   the two ever disagree, the cell is marked here rather than quietly dropped
   from the sum, which is the only way a wrong total could look right. */
function impGridNum(raw){
  let s = String(raw == null ? '' : raw)
    .replace(/[\s  '`]/g, '').replace(/AZN|azn|₼/g, '');
  if (!s) return null;                       // empty is not an error
  const neg = s.startsWith('-');
  s = s.replace(/^[+-]/, '');
  const commas = (s.match(/,/g) || []).length;
  const dots = (s.match(/\./g) || []).length;
  if (commas && dots){
    s = s.lastIndexOf(',') > s.lastIndexOf('.')
      ? s.replace(/\./g, '').replace(',', '.')
      : s.replace(/,/g, '');
  } else if (commas > 1){
    s = s.replace(/,/g, '');
  } else if (commas === 1){
    const head = s.slice(0, s.indexOf(','));
    const tail = s.slice(s.indexOf(',') + 1);
    if (tail.length === 3 && /\d$/.test(head)) return NaN;     // ambiguous
    s = s.replace(',', '.');
  } else if (dots > 1){
    s = s.replace(/\./g, '');
  }
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  // A negative cost or residual is refused by the engine, so it must not be
  // quietly folded into a total the user is about to trust.
  if (neg) return NaN;
  return parseFloat(s);
}

/* A row counts as filled only on its own content. The category column never
   qualifies: it is a dropdown, so it always holds a value, and "apply to all
   rows" would otherwise turn every blank line into a row. The engine draws
   the same line -- it skips a line with neither name nor inv_no. */
const GRID_SELF = GRID_COLS.map((f, i) => i).filter(i => GRID_COLS[i] !== 'category');
const impGridFilled = row => GRID_SELF.some(i => String(row[i] ?? '').trim());

function impGridTotals(){
  if (!document.getElementById('gridcount')) return;
  impGridRead();
  const ci = GRID_COLS.indexOf('cost'), ri = GRID_COLS.indexOf('opening_residual');
  const ni = GRID_COLS.indexOf('name');
  let rows = 0, noName = 0, sum = {[ci]: 0, [ri]: 0}, bad = {[ci]: 0, [ri]: 0};
  IMP.grid.forEach((row, r) => {
    if (!impGridFilled(row)) return;
    rows++;
    if (!String(row[ni]).trim()) noName++;
    for (const c of [ci, ri]){
      const v = impGridNum(row[c]);
      if (v === null) continue;
      if (Number.isNaN(v)) bad[c]++; else sum[c] += v;
      const el = document.querySelector(`#gridbody [data-r="${r}"][data-c="${c}"]`);
      if (el) el.classList.toggle('badnum', Number.isNaN(v));
    }
  });
  const cell = (id, c) => {
    document.getElementById(id).innerHTML = rows
      ? fmt.format(sum[c]) + (bad[c] ? ` <span class="badtag">+${bad[c]}?</span>` : '')
      : '';
  };
  document.getElementById('gridcount').textContent =
    rows ? `Cəmi: ${rows} sətir` : '';
  cell('gridsumcost', ci);
  cell('gridsumres', ri);
  const problems = [];
  if (noName) problems.push(`${noName} sətirdə ad yoxdur`);
  if (bad[ci] + bad[ri]) problems.push(`${bad[ci] + bad[ri]} rəqəm oxunmur`);
  document.getElementById('gridbad').innerHTML = problems.length
    ? `<span class="badtag">${esc(problems.join('; '))}</span>` : '';
}

/* Read the DOM back into IMP.grid so edits survive a re-render or a trip to
   the preview and back. */
function impGridRead(){
  for (const el of document.querySelectorAll('#gridbody [data-r]'))
    IMP.grid[+el.dataset.r][+el.dataset.c] = el.value;
}

function impGridAdd(n){
  impGridRead();
  for (let i = 0; i < n; i++) IMP.grid.push(GRID_COLS.map(() => ''));
  impGrid(IMP.grid);
}

function impGridAllCats(code){
  if (!code) return;
  impGridRead();
  const c = GRID_COLS.indexOf('category');
  IMP.grid.forEach(r => { r[c] = code; });
  impGrid(IMP.grid);
}

function impGridPaste(e){
  const el = e.target;
  if (!el.dataset || el.dataset.r == null) return true;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text) return true;
  const block = text.replace(/\r\n?/g, '\n').replace(/\n+$/, '')
                    .split('\n').map(l => l.split('\t'));
  // A single value is an ordinary paste -- let the browser do it.
  if (block.length === 1 && block[0].length === 1) return true;
  e.preventDefault();

  impGridRead();
  const r0 = +el.dataset.r, c0 = +el.dataset.c;
  while (IMP.grid.length < r0 + block.length)
    IMP.grid.push(GRID_COLS.map(() => ''));
  block.forEach((line, i) => line.forEach((v, j) => {
    const c = c0 + j;
    if (c >= GRID_COLS.length) return;          // wider than the grid: ignore
    IMP.grid[r0 + i][c] = GRID_COLS[c] === 'category'
      ? impGridCat(v) : v.trim();
  }));
  impGrid(IMP.grid);
  return false;
}

/* A pasted category may be our code, or the Azerbaijani name from their
   sheet. Anything else is left for the preview to reject by name. */
function impGridCat(v){
  const s = String(v).trim().toLowerCase();
  const hit = impCats().find(k => k.code.toLowerCase() === s
                              || k.name_az.toLowerCase() === s);
  return hit ? hit.code : s;
}

async function impPreview(){
  IMP.step = 3;
  const rep = (await post('asset.import',
    {rows: impPayload(), opening_year: IMP.year, dry_run: true})).result;
  const bad = rep.errors.length;
  const carried = rep.rows.filter(r => r.mode === 'carried').length;
  const fresh = rep.rows.filter(r => r.mode === 'new').length;
  const auto = rep.rows.filter(r => r.auto_inv).length;

  const summary = bad
    ? `<div class="note"><strong>${bad} sətirdə problem var.</strong>
        İdxal ya bütövlükdə keçir, ya da heç keçmir — belə ki, yarımçıq
        müştəri yaranmasın. Aşağıda qırmızı sətirləri düzəldib yenidən cəhd edin.</div>`
    : `<div class="note q"><strong>${rep.created} ƏV əlavə olunacaq.</strong><br>
        ${carried ? `${carried}-i əvvəlki illərdən gəlir — ${IMP.year} ilin
          əvvəlinə qalıq dəyəri ilə.<br>` : ''}
        ${fresh ? `${fresh}-i bu il alınıb — ilkin dəyəri ilə.<br>` : ''}
        ${auto ? `${auto} ƏV üçün inventar nömrəsi avtomatik veriləcək.` : ''}</div>`;

  impBox(3, summary + `
    <div class="scroll imp" style="max-height:42vh"><table><thead><tr>
      <th>#</th><th>İnv.№</th><th>Adı</th><th>Kateqoriya</th>
      <th class="num">İlkin dəyər</th><th class="num">Qalıq dəyər</th>
      <th>Nəticə</th></tr></thead><tbody>${
      rep.rows.map(r => `<tr class="${r.ok?'good':'bad'}">
        <td>${r.line}</td>
        <td>${esc(r.inv_no)}${r.auto_inv ? '<span class="tag">avto</span>' : ''}</td>
        <td>${esc(r.name)}</td><td>${esc(r.category||'')}</td>
        <td class="num">${r.cost ? money(r.cost) : ''}</td>
        <td class="num">${r.residual ? money(r.residual) : ''}</td>
        <td>${r.ok ? '✓' : esc(r.message)}</td></tr>`).join('')}</tbody></table></div>`,
    bad ? (IMP.back === impGrid ? 'Cədvələ qayıt' : 'Sütunlara qayıt')
        : `Bəli, ${rep.created} ƏV idxal et`,
    () => (IMP.back || impColumns)());

  MSUBMIT = async () => {
    if (bad){ (IMP.back || impColumns)(); throw new Error(STAY); }
    await post('asset.import', {rows: impPayload(), opening_year: IMP.year});
  };
}

/* ---- taxpayer status ---- */
/* Everything about the FIRM, as opposed to its assets. The creation form
   asked for these once and then there was nowhere to go: a typo in the name,
   the wrong VÖEN or the wrong status was permanent. */
function formSettings(){
  if (!REPORT) return fail('Əvvəlcə müştəri seçin');
  const slug = document.getElementById('client').value;
  openModal(`Firmanın parametrləri — ${esc(REPORT.client_name || slug)}`,
    fld('client_name','Firmanın adı',{value:REPORT.client_name,req:true}) +
    `<div class="row2">
      ${fld('voen','VÖEN',{value:REPORT.voen})}
      ${fld('start_year','Başlanğıc il',{type:'number',value:REPORT.start_year,req:true,
            hint:'Bundan əvvəlki illər göstərilmir.'})}</div>
    <div class="fld"><label>Sahibkarlıq statusu — ${REPORT.year}</label>
      <div class="h" style="margin:0 0 8px">Status <strong>il üzrə</strong>
        saxlanılır: dövriyyə və işçi sayı hər il yenidən qiymətləndirilir,
        ona görə keçmiş illər dəyişmir.</div>
      ${REPORT.is_closed
        ? `<div class="note">${REPORT.year} bağlıdır — status dəyişdirilmir.</div>`
        : `<button type="button" class="btn" style="border:1px solid var(--line)"
             onclick="closeModal(); formStatus(${REPORT.year})"
             >${esc(REPORT.status_name)} — dəyiş</button>`}</div>
    <div class="note q">Qovluğun adı — <code>${esc(slug)}</code> — dəyişmir:
      onunla ehtiyat nüsxələr və arxivlər bağlıdır. Başqa ad lazımdırsa,
      «⇄ Baza» ilə ixrac edib yeni adla idxal edin.</div>`,
    d => post('client.update', d));
}

/* The four statuses and what each multiplies the norm by. Comes from the
   report, i.e. from the rate table, because a coefficient is a figure of the
   law and §5.1-bis keeps those out of code. Before the first report exists
   there is nothing to compute a ceiling for, so plain labels will do. */
const STATUS_FALLBACK = {mikro:{name:'Mikro sahibkar'}, kicik:{name:'Kiçik sahibkar'},
                         orta:{name:'Orta sahibkar'}, iri:{name:'İri sahibkar'}};

function formStatus(year){
  // Reachable before any report exists, so it cannot read REPORT.
  const y = year || REPORT.year;
  const cur = REPORT ? REPORT.status : 'mikro';
  const COEF = (REPORT && REPORT.coefficients) || STATUS_FALLBACK;

  // Setting the status is the moment the right to the coefficient appears,
  // so it is the moment to ask whether to use it. The engine never applies it
  // by itself (§5.2) -- doubling a client's depreciation is not a decision a
  // program makes -- but the election used to live on another screen
  // entirely, which is how "I set kiçik and the 1.5 never applied" happens.
  //
  // Per CATEGORY, not one switch for everything: the answer is often "yes for
  // the cars, no for the building". Nothing is ticked by default, and a rate
  // chosen for an individual asset is more specific and survives untouched,
  // which is how "all the cars at 1.5 except this one" stays expressible.
  const cats = (REPORT ? REPORT.categories : []).filter(c => c.cards.length);
  const coefBox = cats.length ? `<div class="fld" id="coefbox">
      <label>Əmsalı tətbiq et — kateqoriya üzrə</label>
      ${cats.map(c => `<label data-max="${c.rate.statutory_max}"
        style="display:flex;gap:8px;align-items:center;padding:3px 0">
        <input type="checkbox" name="apply_cat" value="${c.code}" style="width:auto">
        <span>${esc(c.name_az)} — <span class="cur"></span></span></label>`).join('')}
      <div class="h">Qeyd edilməyən kateqoriyalar m.114.3 norması ilə qalır.
        Ayrı-ayrı ƏV üçün seçilmiş fərdi dərəcələr dəyişmir.</div>
    </div>` : '';

  openModal(`Sahibkarlıq statusu — ${y}`,
    `<input type="hidden" name="year" value="${y}">` +
    fld('status','Status',{type:'select',req:true,options:
      Object.entries(COEF).map(([v,s]) => `<option value="${v}"
        ${v===cur?'selected':''}>${esc(s.name)}${s.coefficient
          ? ` (×${esc(s.coefficient)})` : ''}</option>`).join('')}) +
    fld('basis','Əsas',{placeholder:'İllik dövriyyə, işçi sayı…'}) +
    `<div class="fld"><label style="display:flex;gap:8px;align-items:flex-start">
       <input type="checkbox" name="no_coefficient" style="width:auto;margin-top:3px"
         ${REPORT && REPORT.use_coefficient === false ? 'checked' : ''}>
       <span><strong>Əmsalsız hesabla</strong>
         <div class="h" style="margin:2px 0 0">Sahibkarlıq əmsalından imtina:
           yuxarı hədd m.114.3 normasında qalır və hesabat əmsalı təklif etmir.
           Status faktdır, əmsaldan istifadə isə qərardır — ayrıca saxlanılır.</div>
       </span></label></div>` + coefBox,
    d => post('status.set', {...d, use_coefficient: !d.no_coefficient,
      // FormData collapses repeated names, so the ticks are read from the DOM.
      apply_coefficient_to: [...document.querySelectorAll(
        '#mbody input[name=apply_cat]:checked')].map(x => x.value)}));

  const sel = document.querySelector('#mbody select[name=status]');
  const off = document.querySelector('#mbody input[name=no_coefficient]');
  window.STATUSCOEF = () => {
    const box = document.getElementById('coefbox');
    if (!box) return;
    const c = off.checked ? 1 : parseFloat((COEF[sel.value] || {}).coefficient || 1);
    box.style.display = c > 1 ? '' : 'none';
    box.querySelectorAll('[data-max]').forEach(el => {
      const max = parseFloat(el.dataset.max), ceil = Math.min(max * c, 1);
      el.querySelector('.cur').innerHTML =
        `${pct(max)} × ${c} = <strong>${pct(ceil)}</strong>`;
    });
  };
  sel.onchange = off.onchange = STATUSCOEF;
  STATUSCOEF();
}

/* ---- write-off decision & delete ---- */
function toggleWriteoff(card, on){
  openModal(on ? '500/5% silinməsi' : 'Silinmə qərarını ləğv et',
    `<input type="hidden" name="asset_id" value="${card.asset_id}">
     <input type="hidden" name="year" value="${REPORT.year}">
     <input type="hidden" name="enabled" value="${on ? '1' : ''}">
     <div class="h" style="margin-bottom:12px">${esc(card.threshold_reason)}</div>` +
    (on ? fld('reason','Əsas',{value:'VM m.114 — 500/5% həddi, birdəfəlik silinmə'})
        : '<div class="h">Silinmə qərarı silinəcək, ƏV adi qaydada amortizasiya olunacaq.</div>'),
    d => post('writeoff.set', {...d, enabled: on}), on ? 'Sil' : 'Ləğv et');
}

function confirmDelete(card){
  openModal(`ƏV silinsin? — ${card.inv_no || card.name}`,
    `<input type="hidden" name="asset_id" value="${card.asset_id}">
     <div class="h">Bu ƏV ilə birlikdə ona aid <strong>bütün</strong> sətirlər
     silinir: açılış qalığı, xaricetmə, təmir, silinmə qərarı, fərdi dərəcə.
     Əməliyyatdan əvvəl ehtiyat nüsxə götürülür.</div>`,
    d => post('asset.delete', d), 'Sil');
}

/* The tab strip follows TAB rather than the other way round, so a jump made
   from inside a view (a declaration line to the table behind it) does not
   leave the strip pointing at the tab the reader just left. */
function syncTabs(){
  document.querySelectorAll('.tabs button').forEach(
    x => x.setAttribute('aria-selected', String(x.dataset.tab === TAB)));
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab; syncTabs(); render();
});
document.getElementById('filter').oninput = e => { FILTER = e.target.value.trim().toLowerCase(); render(); };
document.addEventListener('keydown', e => {
  if (e.key === '/' && e.target.tagName !== 'INPUT'){ e.preventDefault(); document.getElementById('filter').focus(); }
  if (e.key === 'Escape') closeDrawer();
});
boot();
</script>
